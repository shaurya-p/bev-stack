[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bevstack"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "nuscenes-devkit>=1.2.0",
    "pyyaml>=6.0.3",
]

[tool.hatch.build.targets.wheel]
packages = ["backend/bevstack"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    # matplotlib is used only by debug/verification scripts under backend/apps/.
    # The bevstack library itself does not import it.
    "matplotlib>=3.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
